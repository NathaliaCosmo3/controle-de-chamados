<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de chamados</title>
<style>
:root {
  color-scheme: light;
  --surface: #ffffff;
  --canvas: #faf6f1;
  --ink: #281e19;
  --muted: #6f574a;
  --line: #e9ddd3;
  --accent: #a23f1c;
  --accent-hover: #7d3015;
  --accent-soft: #fff1e6;
  --header: #2e1d16;
  --header-end: #552a19;
  --highlight: #ee9b58;
}
body.inventory {
  --accent: #95500d; --accent-hover: #733a05; --accent-soft: #fff3e1;
  --header-end: #593713; --highlight: #efae5d;
}
body.sla {
  --accent: #a83e2c; --accent-hover: #823021; --accent-soft: #fff0ea;
  --header-end: #5b2b24; --highlight: #ef9a7e;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--canvas); color: var(--ink);
  font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
}
.wrap, main { width: min(1280px, calc(100% - 64px)); margin-inline: auto; }
header {
  background: linear-gradient(105deg, var(--header) 28%, var(--header-end));
  color: #fff7f0; padding-block: clamp(34px, 6vw, 72px); border-bottom: 4px solid var(--highlight);
}
h1 { font-size: clamp(2rem, 4.8vw, 3.55rem); line-height: 1.04; letter-spacing: -.05em; margin: 0 0 12px; }
header p { margin: 0; color: #f3d6c6; max-width: 62ch; }
main { padding-block: 26px 48px; }
.workspace { display: grid; grid-template-columns: minmax(260px, 312px) minmax(0, 1fr); gap: 20px; align-items: start; }
.panel {
  min-width: 0; padding: clamp(17px, 2.1vw, 25px); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px -22px #4a201d55;
}
.results { min-width: 0; display: grid; gap: 16px; }
h2 { margin: 0 0 16px; font-size: 1.15rem; letter-spacing: -.025em; }
form, .filters { display: grid; gap: 12px; }
form { grid-template-columns: minmax(0, 1fr); }
.filters { grid-template-columns: minmax(160px, 1.5fr) minmax(135px, 1fr) auto; align-items: end; }
label { display: grid; gap: 5px; font-size: .87rem; font-weight: 650; }
input, select, textarea, button { font: inherit; border-radius: 8px; min-height: 42px; padding: 8px 11px; }
input, select, textarea { width: 100%; min-width: 0; border: 1px solid #c9b7aa; background: #fff; color: var(--ink); }
input::placeholder, textarea::placeholder { color: var(--muted); }
textarea { min-height: 90px; resize: vertical; }
button { border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; font-size: .9rem; font-weight: 650; }
button:hover { background: var(--accent-hover); }
button.secondary { background: var(--surface); color: var(--accent-hover); border-color: #d5b8a5; }
button.secondary:hover { background: var(--accent-soft); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#stats { margin: 16px 0 10px; color: var(--muted); font-size: .85rem; }
.table { overflow: auto; border: 1px solid var(--line); border-radius: 9px; }
table { width: 100%; min-width: 530px; border-collapse: collapse; text-align: left; }
th, td { padding: 11px 12px; vertical-align: middle; }
th { background: var(--accent-soft); color: var(--accent-hover); font-size: .82rem; }
td { border-top: 1px solid var(--line); font-size: .92rem; overflow-wrap: anywhere; }
tbody tr:hover { background: #fdf8f4; }
td button { min-height: 35px; padding: 5px 9px; }
.empty { margin: 0; padding: 14px; color: var(--muted); font-size: .9rem; }
.table:has(tbody:not(:empty)) .empty, :is(#calendar, #history):not(:empty) + .empty { display: none; }
output { display: block; margin-top: 14px; padding: 10px 12px; color: var(--accent-hover); background: var(--accent-soft); border-radius: 8px; font-weight: 650; }
output:empty { display: none; }
.due { border-inline-start: 4px solid var(--accent); background: var(--accent-soft); }
.due h2 { margin-bottom: 6px; }
.due output { margin: 0; padding: 0; background: transparent; font-size: clamp(1.25rem, 3vw, 2rem); }
.due output:not(:empty) + .empty { display: none; }
.due .empty, .results .empty { padding: 0; }
#calendar, #history { margin: 0; padding-inline-start: 24px; font-variant-numeric: tabular-nums; }
#calendar:empty, #history:empty { display: none; }
#calendar li, #history li { padding-block: 4px; }
.footnote { margin: 18px 0 0; color: var(--muted); font-size: .85rem; }
@media (max-width: 950px) { .filters { grid-template-columns: 1fr 1fr; } .filters button { grid-column: 1 / -1; justify-self: start; } }
@media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } .wrap, main { width: calc(100% - 32px); } }
@media (max-width: 420px) { .filters { grid-template-columns: 1fr; } }

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.summary article{background:#fff;border:1px solid var(--line);border-top:3px solid var(--highlight);border-radius:12px;padding:13px}
.summary strong{display:block;color:var(--accent-hover);font-size:1.65rem;font-variant-numeric:tabular-nums}
.summary span{display:block;color:var(--muted);font-size:.83rem}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent-hover);padding:3px 8px;border-radius:6px;font-weight:650;font-size:.82rem}
.tag[data-value="Resolvido"],.tag[data-value="Disponível"]{background:#f0eeee;color:#493a33}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}
td button+button{margin:5px 0 0}
[hidden]{display:none!important}
@media(max-width:420px){.summary{gap:5px}.summary article{padding:6px}.summary span{font-size:.72rem}}
</style>
</head>
<body class="tickets">
<header><div class="wrap"><h1>Controle de chamados</h1><p>Cadastro e acompanhamento de atendimentos de suporte técnico.</p></div></header>
<main><section class="summary" aria-label="Resumo"><article><strong id="metric-0">0</strong><span>Total</span></article><article><strong id="metric-1">0</strong><span>Pendentes</span></article><article><strong id="metric-2">0</strong><span>Resolvidos</span></article></section><div class="workspace"><section class="panel"><h2>Novo chamado</h2><form id="entry"><label>Título<input name="title" required maxlength="80" placeholder="Ex.: Impressora offline"></label><label>Prioridade<select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label><label>Descrição<textarea name="details" required maxlength="400"></textarea></label><button id="save-ticket">Cadastrar</button><button id="cancel-edit" class="secondary" type="button" hidden>Cancelar edição</button></form><output id="message" aria-live="polite"></output></section><section class="panel"><h2>Chamados</h2><div class="filters"><label>Pesquisar<input id="search" type="search" placeholder="Título, descrição ou número"></label><label>Status<select id="status"><option>Todos</option><option>Aberto</option><option>Em atendimento</option><option>Resolvido</option></select></label><button id="export" class="secondary">Exportar CSV</button></div><div class="controls"><button type="button" class="secondary" id="clear-filters">Limpar filtros</button></div><p id="stats" aria-live="polite"></p><div class="table"><table><thead><tr><th>Nº</th><th>Chamado</th><th>Prioridade</th><th>Status</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table><p class="empty">Nenhum registro para exibir.</p></div></section>
</div><p class="footnote">Use dados fictícios nesta demonstração.</p></main>
<script>
const by=id=>document.getElementById(id); const report=message=>{by('message').textContent=message;}; const cell=(row,value)=>{const td=row.insertCell();td.textContent=value;return td;}; const addButton=(parent,label,action)=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.addEventListener('click',action);parent.append(b);}; const normalize=value=>value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,''); const persist=(key,data)=>localStorage.setItem(key,JSON.stringify(data)); const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}; const csvExport=(filename,rows)=>{const escape=value=>{let text=String(value??'');if(/^[=+@\-\t\r\n]/.test(text.trimStart())||/^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const content=rows.map(row=>row.map(escape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const key='nathalia-chamados-v1'; const states=['Aberto','Em atendimento','Resolvido']; let tickets=load(key,[]);
let editingId = null;
const ticketForm = by('entry');
 function tag(row, value) {
  const target = cell(row, '');
  const badge = document.createElement('span');
  badge.className = 'tag';
  badge.dataset.value = value;
  badge.textContent = value;
  target.append(badge);
}
function filtered(){const search=normalize(by('search').value.trim());return tickets.filter(t=>(by('status').value==='Todos'||t.status===by('status').value)&&normalize(t.id+' '+t.title+' '+t.details).includes(search));} function render(){const rows=by('rows');rows.replaceChildren();const visible=filtered();
  [tickets.length,tickets.filter(t=>t.status!=='Resolvido').length,tickets.filter(t=>t.status==='Resolvido').length].forEach((value,index)=>{by('metric-'+index).textContent=value;});
by('stats').textContent=tickets.length+' chamado(s) no total • '+tickets.filter(t=>t.status!=='Resolvido').length+' pendente(s) • '+visible.length+' exibido(s)';for(const t of visible){const row=rows.insertRow();cell(row,t.id);cell(row,t.title+' — '+t.details);tag(row,t.priority);tag(row,t.status);const action=cell(row,'');
addButton(action,'Editar',()=>editTicket(t));
const next=states[(states.indexOf(t.status)+1)%states.length];addButton(action,next==='Aberto'?'Reabrir':next==='Resolvido'?'Resolver':'Iniciar',()=>{save(tickets.map(item=>item.id===t.id?{...item,status:next,updatedAt:new Date().toISOString()}:item),'Chamado #'+t.id+' atualizado.');});}} function save(next,message){try{persist(key,next);tickets=next;render();report(message);return true;}catch{report('O navegador não autorizou o armazenamento local.');return false;}} by('entry').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);const title=data.get('title').trim(),details=data.get('details').trim();if(!title||!details){report('Preencha o título e a descrição.');return;}const changed = {title,details,priority:data.get('priority')};
  const id = editingId ?? ((tickets.at(-1)?.id ?? 0) + 1);
  const now = new Date().toISOString();
  const next = editingId === null
    ? [...tickets,{id,...changed,status:states[0],createdAt:now}]
    : tickets.map(t=>t.id===id?{...t,...changed,updatedAt:now}:t);
  if(save(next,'Chamado #'+id+' salvo.')) resetTicket();});by('search').addEventListener('input',render);by('status').addEventListener('change',render);by('export').addEventListener('click',()=>csvExport('chamados.csv',[['numero','titulo','descricao','prioridade','status'],...filtered().map(t=>[t.id,t.title,t.details,t.priority,t.status])]));render();
by('clear-filters').addEventListener('click', () => {
  by('search').value = '';
  by('status').value = 'Todos';
  render();
  by('search').focus();
});
function resetTicket() {
  editingId = null;
  ticketForm.reset();
  by('save-ticket').textContent = 'Cadastrar';
  by('cancel-edit').hidden = true;
}
function editTicket(ticket) {
  editingId = ticket.id;
  for(const name of ['title','priority','details']) ticketForm.elements.namedItem(name).value=ticket[name];
  by('save-ticket').textContent = 'Salvar alterações';
  by('cancel-edit').hidden = false;
  ticketForm.elements.namedItem('title').focus();
}
by('cancel-edit').addEventListener('click',resetTicket);
</script>
</body>
</html>
