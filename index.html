<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Chamados</title>
<style>
:root {
  color-scheme: light;
  --paper: #faf6f0;
  --ink: #291b16;
  --quiet: #66534a;
  --line: #e6d8ce;
  --orange: #a93f16;
  --orange-dark: #83300f;
  --peach: #fbe8d9;
  font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.sidebar { padding: 30px 16px; background: linear-gradient(160deg,#3e261b,#2c1d16); color: #fff6ee; }
.sidebar a { display: flex; gap: 12px; align-items: center; color: inherit; text-decoration: none; }
.brand { padding: 0 8px 28px; font-size: 1.3rem; font-weight: 750; }
.brand span { color: #ff9b49; font-size: 1.65rem; }
nav { display: grid; gap: 6px; }
nav a { padding: 11px 12px; border-radius: 9px; font-weight: 600; }
nav a:hover { background: #5c3928; }
nav .active { background: var(--orange); }
nav span { width: 20px; text-align: center; }
main { width: 100%; max-width: 1450px; padding: clamp(16px, 3vw, 44px); margin-inline: auto; }
.heading,.toolbar,.footer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.heading { justify-content: space-between; margin-bottom: 24px; }
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3.3rem); line-height: 1.08; letter-spacing: -.05em; }
h2 { margin: 0; font-size: clamp(1.2rem, 2.3vw, 1.75rem); letter-spacing: -.035em; }
button,input,select,textarea { font: inherit; border-radius: 8px; }
button { border: 1px solid transparent; background: var(--orange); color: #fff; padding: 9px 13px; font-weight: 650; cursor: pointer; }
button:hover { background: var(--orange-dark); }
button:disabled { opacity: .52; cursor: default; }
button.secondary { border-color: var(--line); background: #fff; color: var(--orange-dark); }
button.secondary:hover:not(:disabled) { background: var(--peach); }
:focus-visible { outline: 3px solid #c96629; outline-offset: 2px; }
.summary { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; margin-bottom: 24px; }
.summary article,.panel,dialog { background: #fffdfa; border: 1px solid var(--line); border-radius: 13px; }
.summary article { position: relative; padding: 16px; }
.summary span { display: block; font-weight: 700; }
.summary strong { color: var(--orange); font-variant-numeric: tabular-nums; font-size: clamp(1.9rem,4vw,3.3rem); line-height: 1.08; }
.summary i { position: absolute; inset: auto 14px 14px auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; color: var(--orange-dark); background: var(--peach); font: 700 1.25rem system-ui; }
.panel { padding: clamp(12px,2vw,22px); }
.toolbar { margin-bottom: 17px; }
.toolbar h2 { flex: 1 1 210px; }
input,select,textarea { padding: 9px 11px; color: var(--ink); background: #fff; border: 1px solid #cbbab0; min-width: 0; }
.toolbar input { flex: 1 1 155px; }
.table { overflow: auto; }
table { width: 100%; min-width: 660px; border-spacing: 0; text-align: left; }
th,td { padding: 12px 10px; }
th { background: #f3e9df; font-size: .88rem; }
th:first-child { border-radius: 8px 0 0 8px; }
th:last-child { border-radius: 0 8px 8px 0; }
td { border-bottom: 1px solid var(--line); font-size: .875rem; overflow-wrap: anywhere; }
td:first-child { min-width: 180px; }
td small { display: block; color: var(--quiet); margin-top: 3px; }
.tag { display: inline-block; border-radius: 99px; padding: 4px 9px; background: var(--peach); color: #753014; font-weight: 650; }
.tag[data-value="Alta"],.tag[data-value="Aberto"] { background: #f9d8cd; }
.tag[data-value="Resolvido"] { background: #efe4df; color: #594137; }
.actions { display: flex; flex-wrap: wrap; gap: 4px; }
.actions button { font-size: .8rem; padding: 4px 8px; }
.footer { justify-content: flex-end; margin-top: 12px; }
.footer p { margin: 0 auto 0 0; }
.empty,#stats,#message,#form-message { color: var(--quiet); font-size: .875rem; }
#form-message:empty,#message:empty { display: none; }
dialog { width: min(calc(100% - 28px),460px); padding: 22px; color: var(--ink); }
dialog::backdrop { background: #2c1d1699; }
dialog form { display: grid; gap: 12px; margin-top: 14px; }
dialog label { display: grid; gap: 4px; font-weight: 650; }
[hidden] { display: none !important; }
@media (max-width: 940px) { .summary i { display: none; } }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  .sidebar { padding: 10px 14px; }
  .brand { padding: 0 0 6px; }
  nav { display: flex; flex-wrap: wrap; }
  nav a { padding: 6px 8px; }
  .summary { gap: 6px; }
  .summary article { padding: 8px; font-size: .8rem; }
}
@media (max-width: 560px) {
  .table table { min-width: 0; }
  .table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .table tbody { display: grid; gap: 10px; }
  .table tbody tr { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 8px; }
  .table td { min-width: 0; border: 0; padding: 6px 10px; }
  .table td:first-child, .table td:last-child { grid-column: 1 / -1; }
  .table td[data-label]::before { content: attr(data-label); display: block; color: var(--quiet); font-size: .75rem; }
}
</style>
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#main"><span aria-hidden="true">◈</span> Suporte TI</a>
  <nav aria-label="Projetos">
    <a class="active" href="#main" aria-current="page"><span aria-hidden="true">▣</span> Chamados</a>
    <a href="https://github.com/NathaliaCosmo3/inventario-de-equipamentos#abrir-a-versão-visual"><span aria-hidden="true">▤</span> Inventário</a>
    <a id="open-sla" href="https://github.com/NathaliaCosmo3/calculadora-de-sla#abrir-a-versão-visual" target="_blank" rel="noopener"><span aria-hidden="true">▦</span> Prazos</a>
  </nav>
</aside>
<main id="main">
  <header class="heading">
    <h1>Controle de Chamados</h1>
    <button id="new-ticket" type="button"><span aria-hidden="true">＋</span> Novo chamado</button>
  </header>
  <section class="summary" aria-label="Resumo dos chamados">
    <article><span>Abertos</span><strong id="metric-0">0</strong><i aria-hidden="true">▣</i></article>
    <article><span>Em atendimento</span><strong id="metric-1">0</strong><i aria-hidden="true">◷</i></article>
    <article><span>Resolvidos</span><strong id="metric-2">0</strong><i aria-hidden="true">✓</i></article>
  </section>
  <section class="panel" aria-labelledby="recent-title">
    <div class="toolbar">
      <h2 id="recent-title">Chamados recentes</h2>
      <input id="search" type="search" aria-label="Buscar chamado" placeholder="Buscar chamado…">
      <select id="status" aria-label="Filtrar por status">
        <option value="Todos">Todos os status</option>
        <option>Aberto</option><option>Em atendimento</option><option>Resolvido</option>
      </select>
    </div>
    <div class="table" tabindex="0" role="region" aria-label="Lista de chamados">
      <table>
        <thead><tr><th scope="col">Chamado</th><th scope="col">Prioridade</th><th scope="col">Status</th><th scope="col">Atualizado em</th><th scope="col">Ações</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden></p>
    <div class="footer">
      <p id="stats" aria-live="polite"></p>
      <button id="clear-filters" type="button" class="secondary" hidden>Limpar filtros</button>
      <button id="export" type="button" class="secondary" disabled>Exportar CSV</button>
    </div>
  </section>
  <p id="message" role="status"></p>
</main>
<dialog id="ticket-dialog" aria-labelledby="form-title">
  <h2 id="form-title">Novo chamado</h2>
  <form id="entry">
    <label>Título<input name="title" required maxlength="80" placeholder="Ex.: Impressora offline" autofocus></label>
    <label>Prioridade<select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label>
    <label>Descrição<textarea name="details" rows="4" required maxlength="400"></textarea></label>
    <p id="form-message" role="status"></p>
    <div class="footer">
      <button id="cancel-edit" class="secondary" type="button">Cancelar</button>
      <button id="save-ticket" type="submit">Cadastrar</button>
    </div>
  </form>
</dialog>
<script>
const by=id=>document.getElementById(id); const report=message=>{by(by('ticket-dialog').open ? 'form-message' : 'message').textContent=message;}; const cell=(row,value)=>{const td=row.insertCell();td.textContent=value;return td;}; const addButton=(parent,label,action)=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.addEventListener('click',action);parent.append(b);}; const normalize=value=>value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,''); const csvExport=(filename,rows)=>{const escape=value=>{let text=String(value??'');if(/^[=+@\-\t\r\n]/.test(text.trimStart())||/^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const content=rows.map(row=>row.map(escape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};

const key = 'nathalia-chamados-v1';
const statuses = ['Aberto', 'Em atendimento', 'Resolvido'];
const formatter = new Intl.DateTimeFormat('pt-BR', {dateStyle:'short', timeStyle:'short'});
const form = by('entry');
const dialog = by('ticket-dialog');
let storedVersion;
let tickets = [];
try {
  storedVersion = localStorage.getItem(key);
  const stored = JSON.parse(storedVersion);
  if (Array.isArray(stored)) tickets = stored;
  else if (storedVersion !== null) throw new Error('Formato inesperado');
} catch {
  storedVersion = undefined;
  report('Não foi possível ler os dados locais. Confira se o navegador permite o armazenamento.');
}
let editing = null;
let dialogTrigger = null;

function visibleTickets() {
  const query = normalize(by('search').value.trim());
  const status = by('status').value;
  return tickets.filter(ticket =>
    (status === 'Todos' || status === ticket.status) &&
    normalize(ticket.id + ' ' + ticket.title + ' ' + ticket.details).includes(query)
  ).sort((a,b) => b.id - a.id);
}

function tag(row, value, label) {
  const badge = document.createElement('span');
  badge.className = 'tag';
  badge.dataset.value = value;
  badge.textContent = value;
  const target = cell(row, '');
  target.dataset.label = label;
  target.append(badge);
}

function render() {
  for (const [index, status] of statuses.entries()) {
    by('metric-' + index).textContent = String(tickets.filter(ticket => ticket.status === status).length).padStart(2,'0');
  }
  const visible = visibleTickets();
  const rows = by('rows');
  rows.replaceChildren();
  for (const ticket of visible) {
    const row = rows.insertRow();
    row.dataset.ticketId = ticket.id;
    const title = document.createElement('strong');
    title.textContent = '#' + ticket.id + ' — ' + ticket.title;
    const details = document.createElement('small');
    details.textContent = ticket.details;
    cell(row, '').append(title, details);
    tag(row, ticket.priority, 'Prioridade');
    tag(row, ticket.status, 'Status');
    const time = Date.parse(ticket.updatedAt || ticket.createdAt);
    cell(row, Number.isFinite(time) ? formatter.format(time) : '—').dataset.label = 'Atualizado em';
    const actions = document.createElement('div');
    actions.className = 'actions';
    cell(row, '').append(actions);
    addButton(actions, 'Editar', () => openForm(ticket));
    const next = statuses[(statuses.indexOf(ticket.status) + 1) % statuses.length];
    const label = {'Aberto':'Reabrir','Em atendimento':'Iniciar','Resolvido':'Resolver'}[next];
    addButton(actions,label,() => {
      if (save(tickets.map(item => item.id === ticket.id ? {...item,status:next,updatedAt:new Date().toISOString()} : item))) {
        const updated = rows.querySelector('[data-ticket-id="' + ticket.id + '"] .actions button:last-child');
        (updated || by('status')).focus();
        report('Chamado #' + ticket.id + ' atualizado.');
      }
    });
  }
  by('empty').hidden = visible.length > 0;
  by('empty').textContent = tickets.length ? 'Nenhum chamado corresponde aos filtros.' : 'Nenhum chamado cadastrado. Use Novo chamado para começar.';
  by('stats').textContent = visible.length + ' de ' + tickets.length + ' chamado(s)';
  by('export').disabled = !visible.length;
  by('clear-filters').hidden = !by('search').value && by('status').value === 'Todos';
}

function save(next) {
  try {
    const latest = localStorage.getItem(key);
    if (latest !== storedVersion) {
      if (storedVersion === undefined) {
        report('Os dados locais estão indisponíveis. Confira as permissões de armazenamento ou abra o arquivo em outro navegador.');
      } else {
        report('Os dados mudaram em outra aba. Recarregue a página antes de salvar para evitar sobrescrever registros.');
      }
      return false;
    }
    const serialized = JSON.stringify(next);
    localStorage.setItem(key, serialized);
    storedVersion = serialized;
  } catch {
    report('Não foi possível salvar neste navegador. Confira as permissões de armazenamento antes de tentar novamente.');
    return false;
  }
  tickets = next;
  render();
  return true;
}

function openForm(ticket = null) {
  editing = ticket;
  dialogTrigger = document.activeElement;
  form.reset();
  by('form-message').textContent = '';
  by('form-title').textContent = ticket ? 'Editar chamado #' + ticket.id : 'Novo chamado';
  by('save-ticket').textContent = ticket ? 'Salvar alterações' : 'Cadastrar';
  if (ticket) {
    for (const name of ['title','priority','details']) form.elements.namedItem(name).value = ticket[name];
  }
  dialog.showModal();
}

form.addEventListener('submit', event => {
  event.preventDefault();
  const values = new FormData(form);
  const title = values.get('title').trim();
  const details = values.get('details').trim();
  if (!title || !details) { report('Preencha o título e a descrição.'); return; }
  const now = new Date().toISOString();
  const id = editing?.id ?? tickets.reduce((max,ticket) => Math.max(max,ticket.id),0) + 1;
  const changes = {title,details,priority:values.get('priority'),updatedAt:now};
  const next = editing
    ? tickets.map(ticket => ticket.id === id ? {...ticket,...changes} : ticket)
    : [...tickets,{id,...changes,createdAt:now,status:statuses[0]}];
  if (save(next)) {
    const wasFiltered = !visibleTickets().some(ticket => ticket.id === id);
    if (wasFiltered) {
      by('search').value = '';
      by('status').value = 'Todos';
      render();
    }
    dialog.close();
    report('Chamado #' + id + ' salvo.' + (wasFiltered ? ' Os filtros foram limpos para mostrar o chamado.' : ''));
  }
});
by('new-ticket').addEventListener('click', () => openForm());
by('cancel-edit').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => {
  (dialogTrigger?.isConnected ? dialogTrigger : by('new-ticket')).focus();
});
by('search').addEventListener('input',render);
by('status').addEventListener('change',render);
by('clear-filters').addEventListener('click',() => {
  by('search').value = '';
  by('status').value = 'Todos';
  render();
  by('search').focus();
});
by('export').addEventListener('click',() => csvExport('chamados.csv',[
  ['numero','titulo','descricao','prioridade','status','atualizado_em'],
  ...visibleTickets().map(ticket => [ticket.id,ticket.title,ticket.details,ticket.priority,ticket.status,ticket.updatedAt || ticket.createdAt])
]));
render();
</script>
<script>
// Abre a calculadora a partir deste arquivo, inclusive sem internet.
const slaPage = "\u003c!doctype html>\n\u003chtml lang=\"pt-BR\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Calculadora de SLA\u003c/title>\n\u003cstyle>\n:root {\n  color-scheme: light;\n  --surface: #ffffff;\n  --canvas: #faf6f1;\n  --ink: #281e19;\n  --muted: #6f574a;\n  --line: #e9ddd3;\n  --accent: #a23f1c;\n  --accent-hover: #7d3015;\n  --accent-soft: #fff1e6;\n  --header: #2e1d16;\n  --header-end: #552a19;\n  --highlight: #ee9b58;\n}\nbody.inventory {\n  --accent: #95500d; --accent-hover: #733a05; --accent-soft: #fff3e1;\n  --header-end: #593713; --highlight: #efae5d;\n}\nbody.sla {\n  --accent: #a83e2c; --accent-hover: #823021; --accent-soft: #fff0ea;\n  --header-end: #5b2b24; --highlight: #ef9a7e;\n}\n* { box-sizing: border-box; }\nbody {\n  margin: 0; background: var(--canvas); color: var(--ink);\n  font: 16px/1.5 \"Segoe UI\", system-ui, sans-serif;\n}\n.wrap, main { width: min(1280px, calc(100% - 64px)); margin-inline: auto; }\nheader {\n  background: linear-gradient(105deg, var(--header) 28%, var(--header-end));\n  color: #fff7f0; padding-block: clamp(34px, 6vw, 72px); border-bottom: 4px solid var(--highlight);\n}\nh1 { font-size: clamp(2rem, 4.8vw, 3.55rem); line-height: 1.04; letter-spacing: -.05em; margin: 0 0 12px; }\nheader p { margin: 0; color: #f3d6c6; max-width: 62ch; }\nmain { padding-block: 26px 48px; }\n.workspace { display: grid; grid-template-columns: minmax(260px, 312px) minmax(0, 1fr); gap: 20px; align-items: start; }\n.panel {\n  min-width: 0; padding: clamp(17px, 2.1vw, 25px); background: var(--surface);\n  border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 30px -22px #4a201d55;\n}\n.results { min-width: 0; display: grid; gap: 16px; }\nh2 { margin: 0 0 16px; font-size: 1.15rem; letter-spacing: -.025em; }\nform, .filters { display: grid; gap: 12px; }\nform { grid-template-columns: minmax(0, 1fr); }\n.filters { grid-template-columns: minmax(160px, 1.5fr) minmax(135px, 1fr) auto; align-items: end; }\nlabel { display: grid; gap: 5px; font-size: .87rem; font-weight: 650; }\ninput, select, textarea, button { font: inherit; border-radius: 8px; min-height: 42px; padding: 8px 11px; }\ninput, select, textarea { width: 100%; min-width: 0; border: 1px solid #c9b7aa; background: #fff; color: var(--ink); }\ninput::placeholder, textarea::placeholder { color: var(--muted); }\ntextarea { min-height: 90px; resize: vertical; }\nbutton { border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; font-size: .9rem; font-weight: 650; }\nbutton:hover { background: var(--accent-hover); }\nbutton.secondary { background: var(--surface); color: var(--accent-hover); border-color: #d5b8a5; }\nbutton.secondary:hover { background: var(--accent-soft); }\n:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n#stats { margin: 16px 0 10px; color: var(--muted); font-size: .85rem; }\n.table { overflow: auto; border: 1px solid var(--line); border-radius: 9px; }\ntable { width: 100%; min-width: 530px; border-collapse: collapse; text-align: left; }\nth, td { padding: 11px 12px; vertical-align: middle; }\nth { background: var(--accent-soft); color: var(--accent-hover); font-size: .82rem; }\ntd { border-top: 1px solid var(--line); font-size: .92rem; overflow-wrap: anywhere; }\ntbody tr:hover { background: #fdf8f4; }\ntd button { min-height: 35px; padding: 5px 9px; }\n.empty { margin: 0; padding: 14px; color: var(--muted); font-size: .9rem; }\n.table:has(tbody:not(:empty)) .empty, :is(#calendar, #history):not(:empty) + .empty { display: none; }\noutput { display: block; margin-top: 14px; padding: 10px 12px; color: var(--accent-hover); background: var(--accent-soft); border-radius: 8px; font-weight: 650; }\noutput:empty { display: none; }\n.due { border-inline-start: 4px solid var(--accent); background: var(--accent-soft); }\n.due h2 { margin-bottom: 6px; }\n.due output { margin: 0; padding: 0; background: transparent; font-size: clamp(1.25rem, 3vw, 2rem); }\n.due output:not(:empty) + .empty { display: none; }\n.due .empty, .results .empty { padding: 0; }\n#calendar, #history { margin: 0; padding-inline-start: 24px; font-variant-numeric: tabular-nums; }\n#calendar:empty, #history:empty { display: none; }\n#calendar li, #history li { padding-block: 4px; }\n.footnote { margin: 18px 0 0; color: var(--muted); font-size: .85rem; }\n@media (max-width: 950px) { .filters { grid-template-columns: 1fr 1fr; } .filters button { grid-column: 1 / -1; justify-self: start; } }\n@media (max-width: 760px) { .workspace { grid-template-columns: 1fr; } .wrap, main { width: calc(100% - 32px); } }\n@media (max-width: 420px) { .filters { grid-template-columns: 1fr; } }\n\n.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}\n.summary article{background:#fff;border:1px solid var(--line);border-top:3px solid var(--highlight);border-radius:12px;padding:13px}\n.summary strong{display:block;color:var(--accent-hover);font-size:1.65rem;font-variant-numeric:tabular-nums}\n.summary span{display:block;color:var(--muted);font-size:.83rem}\n.tag{display:inline-block;background:var(--accent-soft);color:var(--accent-hover);padding:3px 8px;border-radius:6px;font-weight:650;font-size:.82rem}\n.tag[data-value=\"Resolvido\"],.tag[data-value=\"Disponível\"]{background:#f0eeee;color:#493a33}\n.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px}\ntd button+button{margin:5px 0 0}\n[hidden]{display:none!important}\n@media(max-width:420px){.summary{gap:5px}.summary article{padding:6px}.summary span{font-size:.72rem}}\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"sla\">\n\u003cheader>\u003cdiv class=\"wrap\">\u003ch1>Calculadora de SLA\u003c/h1>\u003cp>Conte dias úteis e confira quais datas entram no prazo de atendimento.\u003c/p>\u003c/div>\u003c/header>\n\u003cmain>\u003cdiv class=\"workspace\">\u003csection class=\"panel\">\u003ch2>Calcular vencimento\u003c/h2>\u003cform id=\"entry\">\u003clabel>Data de abertura\u003cinput name=\"start\" type=\"date\" min=\"1900-01-01\" max=\"9998-12-31\" required>\u003c/label>\u003clabel>Prazo em dias úteis\u003cinput name=\"days\" type=\"number\" min=\"1\" max=\"365\" value=\"2\" required>\u003c/label>\u003clabel>Feriados opcionais\u003ctextarea name=\"holidays\" placeholder=\"AAAA-MM-DD, um por linha\">\u003c/textarea>\u003c/label>\u003cbutton>Calcular\u003c/button>\u003cbutton type=\"button\" id=\"example\" class=\"secondary\">Carregar exemplo\u003c/button>\u003c/form>\u003c/section>\u003cdiv class=\"results\">\u003csection class=\"panel due\">\u003ch2>Vencimento\u003c/h2>\u003coutput id=\"message\" aria-live=\"polite\">\u003c/output>\u003cp class=\"empty\">O prazo calculado aparece aqui.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>Dias úteis contados\u003c/h2>\u003col id=\"calendar\">\u003c/ol>\u003cp class=\"empty\">Calcule um prazo para ver a contagem.\u003c/p>\u003c/section>\u003csection class=\"panel\">\u003ch2>Histórico neste navegador\u003c/h2>\u003cul id=\"history\">\u003c/ul>\u003cp class=\"empty\">Os cálculos salvos aparecem aqui.\u003c/p>\u003cdiv class=\"controls\">\u003cbutton id=\"export-history\" type=\"button\" class=\"secondary\" hidden>Exportar histórico em CSV\u003c/button>\u003c/div>\u003c/section>\u003c/div>\n\u003c/div>\u003c/main>\n\u003cscript>\nconst by=id=>document.getElementById(id); const report=message=>{by('message').textContent=message;}; const cell=(row,value)=>{const td=row.insertCell();td.textContent=value;return td;}; const addButton=(parent,label,action)=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.addEventListener('click',action);parent.append(b);}; const normalize=value=>value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\\u0300-\\u036f]/g,''); const persist=(key,data)=>localStorage.setItem(key,JSON.stringify(data)); const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}; const csvExport=(filename,rows)=>{const escape=value=>{let text=String(value??'');if(/^[=+@\\-\\t\\r\\n]/.test(text.trimStart())||/^[\\t\\r\\n]/.test(text))text=\"'\"+text;return '\"'+text.replaceAll('\"','\"\"')+'\"';};const content=rows.map(row=>row.map(escape).join(',')).join('\\r\\n');const url=URL.createObjectURL(new Blob(['\\uFEFF',content],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};\nconst form=by('entry');\nconst historyKey='nathalia-sla-history-v1';\nlet saved=load(historyKey,[]);\nconst format=new Intl.DateTimeFormat('pt-BR',{timeZone:'UTC'});function parse(value){if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(value))return null;const result=new Date(value+'T00:00:00Z');return Number.isNaN(result.getTime())||result.toISOString().slice(0,10)!==value?null:result;}function businessDays(start,days,holidays){const current=new Date(start);const timeline=[];while(timeline.length\u003cdays){current.setUTCDate(current.getUTCDate()+1);const weekday=current.getUTCDay();if(weekday!==0&&weekday!==6&&!holidays.has(current.toISOString().slice(0,10)))timeline.push(new Date(current));}return timeline;}function item(list,text){const li=document.createElement('li');li.textContent=text;list.append(li);}form.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(form);const start=parse(data.get('start'));const days=Number(data.get('days'));const holidays=data.get('holidays').trim().split(/[\\s,;]+/).filter(Boolean);by('calendar').replaceChildren();if(!start||!Number.isInteger(days)||days\u003c1||days>365||holidays.some(value=>!parse(value))){report('Confira a data, o prazo e os feriados no formato AAAA-MM-DD.');return;}const timeline=businessDays(start,days,new Set(holidays));const due=format.format(timeline.at(-1));report('Vencimento em '+due);for(const date of timeline)item(by('calendar'),format.format(date));saved=[{start:format.format(start),days,due},...saved].slice(0,10);\n  try { persist(historyKey,saved); } catch { report('Vencimento em '+due+' • Histórico disponível nesta sessão.'); }\n  renderHistory();});by('example').addEventListener('click',()=>{form.elements.namedItem('start').value='2026-11-27';form.elements.namedItem('days').value='2';form.elements.namedItem('holidays').value='2026-11-30';form.requestSubmit();});\nfunction renderHistory(){\n  const list=by('history');\n  list.replaceChildren();\n  for(const record of saved) item(list,record.start+' • '+record.days+' dia(s) útil(eis) • '+record.due);\n  by('export-history').hidden=!saved.length;\n}\nby('export-history').addEventListener('click',()=>{\n  csvExport('historico-sla.csv',[['abertura','dias_uteis','vencimento'],...saved.map(record=>[record.start,record.days,record.due])]);\n});\nrenderHistory();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
