<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de chamados</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eff4ef;color:#142d27;font:16px/1.5 'Segoe UI',sans-serif}header{background:#12372f;color:#fff;padding:50px 0 42px;border-bottom:5px solid #a9d26f}main,.wrap{width:min(960px,92vw);margin:auto}h1{font:700 clamp(2rem,6vw,3.5rem)/1.08 Georgia,serif;margin:0 0 12px}header p{margin:0;color:#d2e5d8}main{padding:28px 0 50px}section{background:#fff;border:1px solid #cddbd1;border-radius:12px;padding:22px;margin-bottom:18px}h2{font-size:1.2rem;margin:0 0 14px}form,.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:5px;font-weight:600;flex:1;min-width:150px}input,select,textarea,button{font:inherit;border-radius:6px;padding:9px 11px}input,select,textarea{width:100%;border:1px solid #829b8f;background:#fff;color:inherit}textarea{min-height:48px}button{border:1px solid #1f5d48;background:#1f5d48;color:white;font-weight:600;cursor:pointer}button:hover{background:#154634}button.secondary{background:#fff;color:#1f5d48}button.secondary:hover{background:#e8f2ec}.table{overflow:auto;margin-top:10px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:10px;border-bottom:1px solid #d9e4db;vertical-align:top}th{background:#eaf2eb}td{overflow-wrap:anywhere}output{display:block;margin:14px 0 0;font-weight:600}output:empty{display:none}small{color:#425a50}.actions{display:flex;flex-wrap:wrap;gap:8px}a{color:#1f5d48}:focus-visible{outline:3px solid #b76a21;outline-offset:2px}ul{margin-bottom:0}</style>
</head>
<body>
<header><div class="wrap"><h1>Controle de chamados</h1><p>Cadastro e acompanhamento de atendimentos de suporte técnico.</p></div></header>
<main><section><h2>Novo chamado</h2><form id="entry"><label>Título<input name="title" required maxlength="80" placeholder="Ex.: Impressora offline"></label><label>Prioridade<select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label><label>Descrição<textarea name="details" required maxlength="400"></textarea></label><button>Cadastrar</button></form><output id="message" aria-live="polite"></output></section><section><h2>Chamados</h2><div class="filters"><label>Pesquisar<input id="search" type="search" placeholder="Título, descrição ou número"></label><label>Status<select id="status"><option>Todos</option><option>Aberto</option><option>Em atendimento</option><option>Resolvido</option></select></label><button id="export" class="secondary">Exportar CSV</button></div><p id="stats" aria-live="polite"></p><div class="table"><table><thead><tr><th>Nº</th><th>Chamado</th><th>Prioridade</th><th>Status</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<p><small>Projeto de portfólio • use dados fictícios.</small></p></main>
<script>
const by=id=>document.getElementById(id); const report=message=>{by('message').textContent=message;}; const cell=(row,value)=>{const td=row.insertCell();td.textContent=value;return td;}; const addButton=(parent,label,action)=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.addEventListener('click',action);parent.append(b);}; const normalize=value=>value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,''); const persist=(key,data)=>localStorage.setItem(key,JSON.stringify(data)); const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}; const csvExport=(filename,rows)=>{const escape=value=>{let text=String(value??'');if(/^[=+@\-\t\r\n]/.test(text.trimStart())||/^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const content=rows.map(row=>row.map(escape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const key='nathalia-chamados-v1'; const states=['Aberto','Em atendimento','Resolvido']; let tickets=load(key,[]); function filtered(){const search=normalize(by('search').value.trim());return tickets.filter(t=>(by('status').value==='Todos'||t.status===by('status').value)&&normalize(t.id+' '+t.title+' '+t.details).includes(search));} function render(){const rows=by('rows');rows.replaceChildren();const visible=filtered();by('stats').textContent=tickets.length+' chamado(s) no total • '+tickets.filter(t=>t.status!=='Resolvido').length+' pendente(s) • '+visible.length+' exibido(s)';for(const t of visible){const row=rows.insertRow();cell(row,t.id);cell(row,t.title+' — '+t.details);cell(row,t.priority);cell(row,t.status);const action=cell(row,'');const next=states[(states.indexOf(t.status)+1)%states.length];addButton(action,next==='Aberto'?'Reabrir':next==='Resolvido'?'Resolver':'Iniciar',()=>{save(tickets.map(item=>item.id===t.id?{...item,status:next}:item),'Chamado #'+t.id+' atualizado.');});}} function save(next,message){try{persist(key,next);tickets=next;render();report(message);return true;}catch{report('O navegador não autorizou o armazenamento local.');return false;}} by('entry').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);const title=data.get('title').trim(),details=data.get('details').trim();if(!title||!details){report('Preencha o título e a descrição.');return;}const id=(tickets.at(-1)?.id??0)+1;if(save([...tickets,{id,title,details,priority:data.get('priority'),status:states[0]}],'Chamado #'+id+' cadastrado.'))event.currentTarget.reset();});by('search').addEventListener('input',render);by('status').addEventListener('change',render);by('export').addEventListener('click',()=>csvExport('chamados.csv',[['numero','titulo','descricao','prioridade','status'],...filtered().map(t=>[t.id,t.title,t.details,t.priority,t.status])]));render();
</script>
</body>
</html>
