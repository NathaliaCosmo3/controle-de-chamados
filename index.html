<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Chamados</title>
<style>
:root {
  color-scheme: light;
  --paper: #faf6f0;
  --ink: #291b16;
  --quiet: #66534a;
  --line: #e6d8ce;
  --orange: #a93f16;
  --orange-dark: #83300f;
  --peach: #fbe8d9;
  font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
.sidebar { padding: 30px 16px; background: linear-gradient(160deg,#3e261b,#2c1d16); color: #fff6ee; }
.sidebar a { display: flex; gap: 12px; align-items: center; color: inherit; text-decoration: none; }
.brand { padding: 0 8px 28px; font-size: 1.3rem; font-weight: 750; }
.brand span { color: #ff9b49; font-size: 1.65rem; }
nav { display: grid; gap: 6px; }
nav a { padding: 11px 12px; border-radius: 9px; font-weight: 600; }
nav a:hover { background: #5c3928; }
nav .active { background: var(--orange); }
nav span { width: 20px; text-align: center; }
main { width: 100%; max-width: 1450px; padding: clamp(16px, 3vw, 44px); margin-inline: auto; }
.heading,.toolbar,.footer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.heading { justify-content: space-between; margin-bottom: 24px; }
h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3.3rem); line-height: 1.08; letter-spacing: -.05em; }
h2 { margin: 0; font-size: clamp(1.2rem, 2.3vw, 1.75rem); letter-spacing: -.035em; }
button,input,select,textarea { font: inherit; border-radius: 8px; }
button { border: 1px solid transparent; background: var(--orange); color: #fff; padding: 9px 13px; font-weight: 650; cursor: pointer; }
button:hover { background: var(--orange-dark); }
button:disabled { opacity: .52; cursor: default; }
button.secondary { border-color: var(--line); background: #fff; color: var(--orange-dark); }
button.secondary:hover:not(:disabled) { background: var(--peach); }
:focus-visible { outline: 3px solid #c96629; outline-offset: 2px; }
.summary { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; margin-bottom: 24px; }
.summary article,.panel,dialog { background: #fffdfa; border: 1px solid var(--line); border-radius: 13px; }
.summary article { position: relative; padding: 16px; }
.summary span { display: block; font-weight: 700; }
.summary strong { color: var(--orange); font-variant-numeric: tabular-nums; font-size: clamp(1.9rem,4vw,3.3rem); line-height: 1.08; }
.summary i { position: absolute; inset: auto 14px 14px auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; color: var(--orange-dark); background: var(--peach); font: 700 1.25rem system-ui; }
.panel { padding: clamp(12px,2vw,22px); }
.toolbar { margin-bottom: 17px; }
.toolbar h2 { flex: 1 1 210px; }
input,select,textarea { padding: 9px 11px; color: var(--ink); background: #fff; border: 1px solid #cbbab0; min-width: 0; }
.toolbar input { flex: 1 1 155px; }
.table { overflow: auto; }
table { width: 100%; min-width: 660px; border-spacing: 0; text-align: left; }
th,td { padding: 12px 10px; }
th { background: #f3e9df; font-size: .88rem; }
th:first-child { border-radius: 8px 0 0 8px; }
th:last-child { border-radius: 0 8px 8px 0; }
td { border-bottom: 1px solid var(--line); font-size: .875rem; overflow-wrap: anywhere; }
td:first-child { min-width: 180px; }
td small { display: block; color: var(--quiet); margin-top: 3px; }
.tag { display: inline-block; border-radius: 99px; padding: 4px 9px; background: var(--peach); color: #753014; font-weight: 650; }
.tag[data-value="Alta"],.tag[data-value="Aberto"] { background: #f9d8cd; }
.tag[data-value="Resolvido"] { background: #efe4df; color: #594137; }
.actions { display: flex; flex-wrap: wrap; gap: 4px; }
.actions button { font-size: .8rem; padding: 4px 8px; }
.footer { justify-content: flex-end; margin-top: 12px; }
.footer p { margin: 0 auto 0 0; }
.empty,#stats,#message,#form-message { color: var(--quiet); font-size: .875rem; }
#form-message:empty,#message:empty { display: none; }
dialog { width: min(calc(100% - 28px),460px); padding: 22px; color: var(--ink); }
dialog::backdrop { background: #2c1d1699; }
dialog form { display: grid; gap: 12px; margin-top: 14px; }
dialog label { display: grid; gap: 4px; font-weight: 650; }
[hidden] { display: none !important; }
@media (max-width: 940px) { .summary i { display: none; } }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; }
  .sidebar { padding: 10px 14px; }
  .brand { padding: 0 0 6px; }
  nav { display: flex; flex-wrap: wrap; }
  nav a { padding: 6px 8px; }
  .summary { gap: 6px; }
  .summary article { padding: 8px; font-size: .8rem; }
}
</style>
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#main"><span aria-hidden="true">◈</span> Suporte TI</a>
  <nav aria-label="Projetos">
    <a class="active" href="#main" aria-current="page"><span aria-hidden="true">▣</span> Chamados</a>
    <a href="https://github.com/NathaliaCosmo3/inventario-de-equipamentos#abrir-a-versão-visual"><span aria-hidden="true">▤</span> Inventário</a>
    <a href="https://github.com/NathaliaCosmo3/calculadora-de-sla#abrir-a-versão-visual"><span aria-hidden="true">▦</span> Prazos</a>
  </nav>
</aside>
<main id="main">
  <header class="heading">
    <h1>Controle de Chamados</h1>
    <button id="new-ticket" type="button"><span aria-hidden="true">＋</span> Novo chamado</button>
  </header>
  <section class="summary" aria-label="Resumo dos chamados">
    <article><span>Abertos</span><strong id="metric-0">0</strong><i aria-hidden="true">▣</i></article>
    <article><span>Em atendimento</span><strong id="metric-1">0</strong><i aria-hidden="true">◷</i></article>
    <article><span>Resolvidos</span><strong id="metric-2">0</strong><i aria-hidden="true">✓</i></article>
  </section>
  <section class="panel" aria-labelledby="recent-title">
    <div class="toolbar">
      <h2 id="recent-title">Chamados recentes</h2>
      <input id="search" type="search" aria-label="Buscar chamado" placeholder="Buscar chamado…">
      <select id="status" aria-label="Filtrar por status">
        <option value="Todos">Todos os status</option>
        <option>Aberto</option><option>Em atendimento</option><option>Resolvido</option>
      </select>
    </div>
    <div class="table" tabindex="0" role="region" aria-label="Lista de chamados">
      <table>
        <thead><tr><th scope="col">Chamado</th><th scope="col">Prioridade</th><th scope="col">Status</th><th scope="col">Atualizado em</th><th scope="col">Ações</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden></p>
    <div class="footer">
      <p id="stats" aria-live="polite"></p>
      <button id="clear-filters" type="button" class="secondary" hidden>Limpar filtros</button>
      <button id="export" type="button" class="secondary" disabled>Exportar CSV</button>
    </div>
  </section>
  <p id="message" role="status"></p>
</main>
<dialog id="ticket-dialog" aria-labelledby="form-title">
  <h2 id="form-title">Novo chamado</h2>
  <form id="entry">
    <label>Título<input name="title" required maxlength="80" placeholder="Ex.: Impressora offline" autofocus></label>
    <label>Prioridade<select name="priority"><option>Normal</option><option>Alta</option><option>Baixa</option></select></label>
    <label>Descrição<textarea name="details" rows="4" required maxlength="400"></textarea></label>
    <p id="form-message" role="status"></p>
    <div class="footer">
      <button id="cancel-edit" class="secondary" type="button">Cancelar</button>
      <button id="save-ticket" type="submit">Cadastrar</button>
    </div>
  </form>
</dialog>
<script>
const by=id=>document.getElementById(id); const report=message=>{by(by('ticket-dialog').open ? 'form-message' : 'message').textContent=message;}; const cell=(row,value)=>{const td=row.insertCell();td.textContent=value;return td;}; const addButton=(parent,label,action)=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=label;b.addEventListener('click',action);parent.append(b);}; const normalize=value=>value.toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,''); const persist=(key,data)=>localStorage.setItem(key,JSON.stringify(data)); const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}; const csvExport=(filename,rows)=>{const escape=value=>{let text=String(value??'');if(/^[=+@\-\t\r\n]/.test(text.trimStart())||/^[\t\r\n]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const content=rows.map(row=>row.map(escape).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\uFEFF',content],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};

const key = 'nathalia-chamados-v1';
const statuses = ['Aberto', 'Em atendimento', 'Resolvido'];
const formatter = new Intl.DateTimeFormat('pt-BR', {dateStyle:'short', timeStyle:'short'});
const form = by('entry');
const dialog = by('ticket-dialog');
const stored = load(key, []);
let tickets = Array.isArray(stored) ? stored : [];
let editing = null;
let dialogTrigger = null;

function visibleTickets() {
  const query = normalize(by('search').value.trim());
  const status = by('status').value;
  return tickets.filter(ticket =>
    (status === 'Todos' || status === ticket.status) &&
    normalize(ticket.id + ' ' + ticket.title + ' ' + ticket.details).includes(query)
  ).sort((a,b) => b.id - a.id);
}

function tag(row, value) {
  const badge = document.createElement('span');
  badge.className = 'tag';
  badge.dataset.value = value;
  badge.textContent = value;
  cell(row, '').append(badge);
}

function render() {
  for (const [index, status] of statuses.entries()) {
    by('metric-' + index).textContent = String(tickets.filter(ticket => ticket.status === status).length).padStart(2,'0');
  }
  const visible = visibleTickets();
  const rows = by('rows');
  rows.replaceChildren();
  for (const ticket of visible) {
    const row = rows.insertRow();
    const title = document.createElement('strong');
    title.textContent = '#' + ticket.id + ' — ' + ticket.title;
    const details = document.createElement('small');
    details.textContent = ticket.details;
    cell(row, '').append(title, details);
    tag(row, ticket.priority);
    tag(row, ticket.status);
    const time = Date.parse(ticket.updatedAt || ticket.createdAt);
    cell(row, Number.isFinite(time) ? formatter.format(time) : '—');
    const actions = document.createElement('div');
    actions.className = 'actions';
    cell(row, '').append(actions);
    addButton(actions, 'Editar', () => openForm(ticket));
    const next = statuses[(statuses.indexOf(ticket.status) + 1) % statuses.length];
    const label = {'Aberto':'Reabrir','Em atendimento':'Iniciar','Resolvido':'Resolver'}[next];
    addButton(actions,label,() => {
      if (save(tickets.map(item => item.id === ticket.id ? {...item,status:next,updatedAt:new Date().toISOString()} : item))) {
        report('Chamado #' + ticket.id + ' atualizado.');
      }
    });
  }
  by('empty').hidden = visible.length > 0;
  by('empty').textContent = tickets.length ? 'Nenhum chamado corresponde aos filtros.' : 'Nenhum chamado cadastrado. Use Novo chamado para começar.';
  by('stats').textContent = visible.length + ' de ' + tickets.length + ' chamado(s)';
  by('export').disabled = !visible.length;
  by('clear-filters').hidden = !by('search').value && by('status').value === 'Todos';
}

function save(next) {
  try { persist(key,next); }
  catch { report('Não foi possível salvar os dados neste navegador.'); return false; }
  tickets = next;
  render();
  return true;
}

function openForm(ticket = null) {
  editing = ticket;
  dialogTrigger = document.activeElement;
  form.reset();
  by('form-message').textContent = '';
  by('form-title').textContent = ticket ? 'Editar chamado #' + ticket.id : 'Novo chamado';
  by('save-ticket').textContent = ticket ? 'Salvar alterações' : 'Cadastrar';
  if (ticket) {
    for (const name of ['title','priority','details']) form.elements.namedItem(name).value = ticket[name];
  }
  dialog.showModal();
}

form.addEventListener('submit', event => {
  event.preventDefault();
  const values = new FormData(form);
  const title = values.get('title').trim();
  const details = values.get('details').trim();
  if (!title || !details) { report('Preencha o título e a descrição.'); return; }
  const now = new Date().toISOString();
  const id = editing?.id ?? tickets.reduce((max,ticket) => Math.max(max,ticket.id),0) + 1;
  const changes = {title,details,priority:values.get('priority'),updatedAt:now};
  const next = editing
    ? tickets.map(ticket => ticket.id === id ? {...ticket,...changes} : ticket)
    : [...tickets,{id,...changes,createdAt:now,status:statuses[0]}];
  if (save(next)) {
    dialog.close();
    report('Chamado #' + id + ' salvo.');
  }
});
by('new-ticket').addEventListener('click', () => openForm());
by('cancel-edit').addEventListener('click', () => dialog.close());
dialog.addEventListener('close', () => {
  (dialogTrigger?.isConnected ? dialogTrigger : by('new-ticket')).focus();
});
by('search').addEventListener('input',render);
by('status').addEventListener('change',render);
by('clear-filters').addEventListener('click',() => {
  by('search').value = '';
  by('status').value = 'Todos';
  render();
  by('search').focus();
});
by('export').addEventListener('click',() => csvExport('chamados.csv',[
  ['numero','titulo','descricao','prioridade','status','atualizado_em'],
  ...visibleTickets().map(ticket => [ticket.id,ticket.title,ticket.details,ticket.priority,ticket.status,ticket.updatedAt || ticket.createdAt])
]));
render();
</script>
</body>
</html>
